        cancelled: "Cancelada"

      medical_record/record_type:
        vaccine: "Vacuna"
        deworming: "Desparasitación"
        surgery: "Cirugía"
        checkup: "Control de rutina"
        treatment: "Tratamiento"

  # ==========================================
  # 3. MENSAJES DE LOS CONTROLADORES (Notice)
  # Usan Lazy Lookup: t(".success")
  # ==========================================
  admin:
    pets:
      create:
        success: "Mascota creada correctamente."
      update:
        success: "Mascota actualizada correctamente."
      destroy:
        success: "Mascota eliminada del sistema."

    adoption_applications:
      update:
        success: "Estado de la solicitud actualizado correctamente."

    medical_records:
      create:
        success: "Registro médico cargado exitosamente."
      update:
        success: "Registro médico actualizado exitosamente."
      destroy:
        success: "Registro médico eliminado."

    shelters:
      create:
        success: "Refugio cargado exitosamente."
      update:
        success: "Refugio actualizado exitosamente."
      destroy:
        success: "Refugio eliminado."

    cities:
      create:
        success: "Ciudad creada correctamente."
      update:
        success: "Ciudad actualizada correctamente."
      destroy:
        success: "Ciudad eliminada del sistema."

    breeds:
      create:
        success: "Raza creada correctamente."
      update:
        success: "Raza actualizada correctamente."
      destroy:
        success: "Raza eliminada del sistema."
      

  # ==========================================

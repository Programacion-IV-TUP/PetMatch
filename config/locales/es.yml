      medical_record: "Registro Médico"
      shelter: "Refugio"
      city: "Ciudad"
      breed: "Raza"

    attributes:
      pet:
        name: "Nombre"
        age_months: "Edad (meses)"
        gender: "Género"
        size: "Tamaño"
        weight: "Peso (kg)"
        description: "Descripción"
        status: "Estado"
        breed: "Raza"
        shelter: "Refugio"
      
      adoption_application:
        status: "Estado de la solicitud"
        notes: "Notas internas de seguimiento"
        user: "Solicitante"
        pet: "Mascota"
      
      medical_record:
        record_type: "Tipo de registro"
        title: "Título / Diagnóstico"
